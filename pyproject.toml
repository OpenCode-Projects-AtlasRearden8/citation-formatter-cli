[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-formatter-cli"
version = "1.0.0"
description = "Offline CLI that turns book/article metadata (or a simple YAML list) into APA, MLA, Chicago, and IEEE citations, a paste-ready bibliography, and KDP-style 'About the Sources' back-matter."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["citations", "apa", "mla", "chicago", "ieee", "bibliography", "kdp", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
citation-formatter = "citation_formatter.cli:main"

[tool.setuptools]
packages = ["citation_formatter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = [
    # Keep Optional[str] for Python 3.9 compatibility (X | None needs 3.10).
    "UP045",
]
